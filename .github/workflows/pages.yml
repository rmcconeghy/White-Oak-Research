name: Build and deploy website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Writing generation
        run: python -m unittest discover -s tests -v
      - name: Generate Writing landing page
        run: python scripts/build_writing.py
      - name: Generate editorial homepage previews
        run: python scripts/build_home.py
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='scripts/' --exclude='tests/' --exclude='__pycache__/' --exclude='_site/' --exclude='README.md' --exclude='WRITING.md' ./ _site/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
